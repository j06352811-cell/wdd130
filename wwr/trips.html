            <div class="adventure-gallery">
                <figure>
                    <img src="images/rafting-gallery.jpg" alt="A rafting group navigating whitewater"

                <figure>

                </figure>

                    <img src="images/rafting-gallery.jpg" alt="A group rafting through a canyon"
